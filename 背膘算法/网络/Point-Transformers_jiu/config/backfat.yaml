batch_size: 16
epoch: 80
learning_rate: 1e-3
gpu: 0
num_point: 2048
optimizer: Adam
weight_decay: 1e-4
#weight_decay: 1e-3
use_normals: False      #是否使用法向量

num_class: 1
use_uniform_sample: True
log_dir: model_146_1.1
device: "cuda"

defaults:
  - model: Hengshuang
  - _self_

hydra:
  run:
    dir: log/cls/${model.name}

  sweep:
    dir: log/cls
    subdir: ${model.name}
